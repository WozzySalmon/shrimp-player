[workspace]
resolver = "3"
members = ["crates/shrimp-core"]
# The milestone-1 spike is throwaway code with its own workspace (SPEC §10).
exclude = ["spike"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WozzySalmon/shrimp-player"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
